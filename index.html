<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网站</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .box {
            background: white;
            padding: 60px 80px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            font-size: 48px;
            margin: 0;
        }
        p {
            color: #666;
            font-size: 20px;            字体大小: 20px;
            margin-top: 10px;            上边距: 10px;
        }
        .emoji {
            font-size: 80px;            字体大小: 80px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="emoji">🎉</div>
        <h1>成功了！</h1>
        <p>你的网站已经上线啦～</p>
    </div>
</body>
</html>
